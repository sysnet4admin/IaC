name: Build Ubuntu 24.04 Vagrant Box (arm64, QEMU)

# arm64 box의 기본 빌드는 로컬 Mac(M 시리즈)이다(bento/BUILD_ARCH_DECISION.md). 이 워크플로는 Mac을 사용할 수 없을 때 손으로 실행한다.
# 러너에 KVM이 없으면 에뮬레이션으로 돌아 packer build에 3시간 19분 걸린다(2026-11-04).
# 게시하지 않는다. 만든 box는 artifact로 남긴다(7일).
on:
  workflow_dispatch:

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -a
          nproc
          free -h
          df -h /
          lscpu | sed -n 1,25p
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils qemu-efi-aarch64
          qemu-system-aarch64 --version
          ls -l /usr/share/AAVMF/

      # /dev/kvm이 있고 QEMU가 KVM으로 시작하면 kvm, 아니면 tcg(에뮬레이션)로 빌드한다
      # tcg에서 -cpu max의 기본 포인터 인증(QARMA5)은 매우 느리다. Ubuntu 24.04 arm64는 PAC 명령을 사용하므로 pauth-impdef=on을 넣는다.
      - name: Choose accelerator
        id: accel
        run: |
          rc=1
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            set +e
            timeout 5 qemu-system-aarch64 -machine virt,accel=kvm -cpu host -m 256 -display none -nodefaults
            rc=$?
            set -e
            echo "KVM start check exit=$rc (124 = KVM으로 실행되다가 timeout으로 끝남)"
          fi
          if [ "$rc" -eq 124 ]; then
            { echo "accel=kvm"; echo "cpu=host"; echo "cpus=2"; echo "ssh_timeout=60m"; echo "grub_steps=6"; } >> "$GITHUB_OUTPUT"
          else
            { echo "accel=tcg"; echo "cpu=max,pauth-impdef=on"; echo "cpus=4"; echo "ssh_timeout=300m"; echo "grub_steps=24"; } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer Init
        working-directory: bento
        run: packer init ubuntu-24.04-aarch64-qemu.pkr.hcl

      - name: Build Box (QEMU)
        working-directory: bento
        run: |
          start=$(date +%s)
          packer build \
            -var "accelerator=${{ steps.accel.outputs.accel }}" \
            -var "cpu_model=${{ steps.accel.outputs.cpu }}" \
            -var "cpus=${{ steps.accel.outputs.cpus }}" \
            -var "ssh_timeout=${{ steps.accel.outputs.ssh_timeout }}" \
            -var "grub_wait_steps=${{ steps.accel.outputs.grub_steps }}" \
            ubuntu-24.04-aarch64-qemu.pkr.hcl
          end=$(date +%s)
          {
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| accelerator | ${{ steps.accel.outputs.accel }} |"
            echo "| cpus | ${{ steps.accel.outputs.cpus }} |"
            echo "| packer build | $(( (end - start) / 60 ))분 $(( (end - start) % 60 ))초 |"
          } >> "$GITHUB_STEP_SUMMARY"

      # VirtualBox에 Linux arm64 호스트용 패키지가 없어 VBoxManage 없이 묶는다.
      # box.ovf와 Vagrantfile은 게시된 1.0.0 arm64 box의 것을 틀로 사용한다(디스크 파일 이름과 크기가 같다).
      - name: Package VirtualBox box
        working-directory: bento
        run: |
          mkdir -p builds/box
          qemu-img convert -f qcow2 -O vmdk -o subformat=streamOptimized \
            builds/ubuntu-24.04-aarch64-qemu/ubuntu-24.04-arm64.qcow2 \
            builds/box/ubuntu-24.04-aarch64-disk001.vmdk
          curl -sSL https://github.com/vg-box/k8s/releases/download/Ubuntu-k8s-1.0.0/Ubuntu-k8s-1.0.0-virtualbox-arm64.box \
            | tar -xzf - -C builds/box box.ovf Vagrantfile metadata.json
          sed -i '/VRDEAutoGenerated/d' builds/box/box.ovf
          tar -C builds/box -cf - box.ovf Vagrantfile metadata.json ubuntu-24.04-aarch64-disk001.vmdk \
            | gzip -9 > builds/ubuntu-24.04-aarch64.virtualbox.box
          ls -l builds/box builds/ubuntu-24.04-aarch64.virtualbox.box
          sha256sum builds/ubuntu-24.04-aarch64.virtualbox.box | tee builds/SHA256SUMS
          echo "| box 크기 | $(stat -c %s builds/ubuntu-24.04-aarch64.virtualbox.box) bytes |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload box
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-aarch64-box
          path: |
            bento/builds/ubuntu-24.04-aarch64.virtualbox.box
            bento/builds/SHA256SUMS
          retention-days: 7
          compression-level: 0

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: bento/serial-aarch64.log
          retention-days: 7
          if-no-files-found: ignore
